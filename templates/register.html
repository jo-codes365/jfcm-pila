{% extends "base.html" %}
{% block title %}Create Account | JFCM Library{% endblock %}
{% block content %}
<main class="auth-page register-page">
  <section class="auth-card">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='images/JF.png') }}" alt="JFCM Pila" class="brand-logo">
    </a>
    <h1>Create your account</h1>
      <p class="muted">Sign up with a username and password. Email is optional.</p>
    <form method="post" class="stack-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"> 
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="20">
      <label for="password">Password</label>
      <div class="password-field">
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">
          <i class="bi bi-eye" aria-hidden="true"></i>
        </button>
      </div>
      <label for="confirm-password">Confirm password</label>
      <div class="password-field">
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required minlength="6">
        <button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show password" aria-pressed="false">
          <i class="bi bi-eye" aria-hidden="true"></i>
        </button>
      </div>
      <button class="button log" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}" class="acc">Sign in</a></p>
    {% include "_legal_links.html" %}
  </section>
</main>
{% endblock %}
