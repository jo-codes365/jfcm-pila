{% extends "base.html" %}
{% block content %}
<div class="storage-shell">
  {% include "_workspace_sidebar.html" %}
  <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation" tabindex="-1" hidden></button>
  <main class="workspace">
    <header class="workspace-header legal-workspace-header"></header>
    <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><i class="bi bi-list" aria-hidden="true"></i></button>
    <div class="workspace-body">
      <div class="workspace-content settings-workspace-content">
        <div class="settings-page legal-workspace-page">
          {% block legal_content %}{% endblock %}
        </div>
      </div>
    </div>
  </main>
</div>
{% endblock %}
