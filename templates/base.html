<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal file storage">
  <meta name="offline-cache-scope" content="{{ offline_cache_scope }}">
  <title>{% block title %}JFCM Library{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/JF.ico') }}">
</head>
<body data-theme="{{ session.get('theme_preference', theme_preference|default('light')) }}">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="toast-stack" aria-live="polite">
        {% for category, message in messages %}
          <div class="toast toast-{{ category }}">{{ message }}</div> 
        {% endfor %}
      </div>
    {% endif %} 
  {% endwith %}
  {% block content %}{% endblock %}
  {% block page_scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
